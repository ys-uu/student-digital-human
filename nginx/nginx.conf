# ============================================================
# Nginx 统一入口配置（开发 / 生产共用同一份，端口差异由 compose 映射处理）
# 后端服务名：backend（Java，:8080）、ai-service（Python，:8000）
# 上游主机名通过 resolver + 变量化 proxy_pass 在请求时解析，故后端未启动时
# Nginx 仍可正常启动（相关路径返回 502），后端就绪后自动恢复
#
# 反爬虫分两层：
#   1) 本文件：边缘层 UA 拦截、IP 限速 / 并发限制、蜜罐路径、robots 与安全响应头
#   2) 后端 AntiCrawlerFilter：业务层滑动窗口限流、违规封禁、登录失败锁定
# ============================================================

# -------- 反爬 / 限流全局定义（http 上下文） --------
# 通用 API：单 IP 每秒 20 个请求，突发 60
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;
# 认证接口：单 IP 每秒 1 个请求，突发 10（登录、注册、短信、刷新令牌）
limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=1r/s;
# AI 接口：单 IP 每秒 2 个请求，突发 20（SSE 长连接，限制新建连接速度）
limit_req_zone $binary_remote_addr zone=ai_rl:10m rate=2r/s;
# 扫码轮询：单 IP 每秒 5 个请求，突发 40
limit_req_zone $binary_remote_addr zone=qr_rl:10m rate=5r/s;
# 单 IP 并发连接数
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

# 常见脚本 / 采集框架的 User-Agent，命中返回 403
map $http_user_agent $bad_bot {
    default  0;
    ""       1;
    "~*(python-requests|python-urllib|scrapy|wget|curl/|httpclient|okhttp|go-http-client|java/|libwww-perl|phantomjs|headlesschrome|selenium|playwright|puppeteer|postmanruntime|insomnia)" 1;
}

server {
    listen       80;
    server_name  localhost;

    # 隐藏 Nginx 版本号，降低被针对性扫描的概率
    server_tokens off;

    # 预留大文件余量（知识库文件实际走 MinIO 预签名直传，不经过本服务）
    client_max_body_size 100m;

    # 慢连接 / 慢请求防护（Slowloris）
    client_header_timeout 10s;
    client_body_timeout   10s;
    keepalive_timeout     30s;

    # 接口内容不允许搜索引擎收录；禁止 MIME 嗅探
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker 自定义桥接网络的内置 DNS。配合下方“变量化 proxy_pass”，
    # 让上游主机名在请求时才解析：后端容器尚未启动时 Nginx 仍可正常启动，
    # 对应路径返回 502；待后端起来后自动恢复，无需重启 Nginx。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # -------- 反爬：robots 与蜜罐 --------
    # 明确拒绝所有爬虫抓取；正常前端页面不依赖 robots.txt
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 蜜罐路径：扫描器常探测的路径，直接断开连接（444 不返回任何内容）
    location = /.env        { return 444; }
    location ^~ /.git/      { return 444; }
    location ^~ /.svn/      { return 444; }
    location = /.git/config { return 444; }
    location ^~ /trap/      { return 444; }
    location ^~ /phpmyadmin/ { return 444; }
    location = /wp-login.php { return 444; }

    # 内部接口：外部访问一律 404，/internal 仅在 Docker 内部网络可达
    location = /internal/ {
        return 404;
    }
    location /internal/ {
        return 404;
    }

    # A) AI 服务（Python，流式 SSE）
    location /api/v1/ai/ {
        if ($bad_bot) {
            return 403;
        }
        limit_req zone=ai_rl burst=20 nodelay;
        limit_conn perip_conn 20;

        set $ai_upstream ai-service:8000;
        proxy_pass http://$ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式关键配置：关闭缓冲、拉长超时、清空 Connection
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # B) 认证接口：独立更严格的限速（登录 / 注册 / 短信 / 刷新令牌）
    location /api/v1/auth/ {
        if ($bad_bot) {
            return 403;
        }
        limit_req zone=auth_rl burst=10 nodelay;
        limit_conn perip_conn 10;

        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # C) Java 主服务：其余 /api 接口
    location /api/ {
        if ($bad_bot) {
            return 403;
        }
        limit_req zone=api_rl burst=60 nodelay;
        limit_conn perip_conn 30;

        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # D) 扫码登录路径（无 /api 前缀，前端会高频轮询）
    location /qr/ {
        if ($bad_bot) {
            return 403;
        }
        limit_req zone=qr_rl burst=40 nodelay;
        limit_conn perip_conn 20;

        set $qr_upstream backend:8080;
        proxy_pass http://$qr_upstream;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # E) WebSocket：限制握手频率与单 IP 并发连接数
    location /ws/ {
        if ($bad_bot) {
            return 403;
        }
        limit_req zone=api_rl burst=10 nodelay;
        limit_conn perip_conn 5;

        set $ws_upstream backend:8080;
        proxy_pass http://$ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # F) 前端静态资源（前端构建产物挂载到 /usr/share/nginx/html 后生效；
    # 开发阶段前端走 Vite 5173，此处暂不挂载）
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}