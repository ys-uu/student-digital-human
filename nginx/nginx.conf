# ============================================================
# Nginx 统一入口配置（开发 / 生产共用同一份，端口差异由 compose 映射处理）
# 后端服务名：backend（Java，:8080）、ai-service（Python，:8000）
# 上游主机名通过 resolver + 变量化 proxy_pass 在请求时解析，故后端未启动时
# Nginx 仍可正常启动（相关路径返回 502），后端就绪后自动恢复
# ============================================================
server {
    listen       80;
    server_name  localhost;

    # 预留大文件余量（知识库文件实际走 MinIO 预签名直传，不经过本服务）
    client_max_body_size 100m;

    # Docker 自定义桥接网络的内置 DNS。配合下方“变量化 proxy_pass”，
    # 让上游主机名在请求时才解析：后端容器尚未启动时 Nginx 仍可正常启动，
    # 对应路径返回 502；待后端起来后自动恢复，无需重启 Nginx。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 内部接口：外部访问一律 404，/internal 仅在 Docker 内部网络可达
    location = /internal/ {
        return 404;
    }
    location /internal/ {
        return 404;
    }

    # AI 服务（Python，流式 SSE）
    location /api/v1/ai/ {
        set $ai_upstream ai-service:8000;
        proxy_pass http://$ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式关键配置：关闭缓冲、拉长超时、清空 Connection
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # Java 主服务：其余 /api 接口
    location /api/ {
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 扫码登录路径（无 /api 前缀）
    location /qr/ {
        set $qr_upstream backend:8080;
        proxy_pass http://$qr_upstream;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端静态资源（前端构建产物挂载到 /usr/share/nginx/html 后生效；
    # 开发阶段前端走 Vite 5173，此处暂不挂载）
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
