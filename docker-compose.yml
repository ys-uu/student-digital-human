# ============================================================
# 本项目本地开发容器编排（v1.3）
# 中间件：MySQL + Redis + MinIO + Qdrant + Embedding(Infinity) + RabbitMQ + Nginx
# 启动：在本文件所在目录执行 docker compose up -d
# 停止：docker compose down（需同时清空数据卷才加 -v，请勿随意使用）
# 说明：应用服务（Java backend、Python ai-service）容器化后再纳入本文件，
#       当前 Nginx 已按服务名预留路由，应用未启动时对应路径返回 502 属正常。
# ============================================================
services:
  # -------- 数据库 --------
  mysql:
    image: mysql:8.0
    container_name: aitutor-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "ai_tutor"
      TZ: Asia/Shanghai
    # 字符集与后端表定义保持一致
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（空数据卷）自动建库导表：清空数据卷后启用下一行，脚本位于 docs/sql/
      # - ./docs/sql/ai_tutor.sql:/docker-entrypoint-initdb.d/ai_tutor.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aitutor-net

  # -------- 缓存 --------
  redis:
    image: redis:7-alpine
    container_name: aitutor-redis
    restart: unless-stopped
    ports:
      # 宿主 6379 被 Windows 服务 rediszt3 占用，本项目 redis 映射到 6381；容器内仍为 6379
      - "6381:6379"
    # AOF 持久化，重启容器后数据不丢；本地开发不设密码
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aitutor-net

  # -------- 对象存储 --------
  # 说明：MinIO 官方社区镜像已于 2026 年归档、停止匿名拉取，改用 Chainguard 从
  # MinIO 源码构建并持续维护的镜像（非 root，内置 mc 客户端），S3 API 完全兼容
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: aitutor-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 管理控制台
    environment:
      # 开发环境默认凭证（均为 8 位）；生产环境必须替换为强密码并改用 env 文件注入
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aitutor-net

  # 一次性任务：MinIO 就绪后创建业务桶，幂等可重复执行
  # 复用 chainguard/minio 镜像（自带 mc 与 sh），通过覆盖 entrypoint 执行建桶
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: aitutor-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/documents &&
      mc mb --ignore-existing local/avatars &&
      mc mb --ignore-existing local/chat-media &&
      echo 'buckets ready' &&
      exit 0;
      "
    restart: "no"
    networks:
      - aitutor-net

  # -------- 向量库 --------
  # 经华为云 SWR 的 ddn-k8s 同步代理拉取 Docker Hub 官方镜像，锁定稳定版 v1.18.2
  qdrant:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/qdrant/qdrant:v1.18.2
    container_name: aitutor-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # 新版镜像不含 wget/curl，改用 bash 内置 /dev/tcp 发起 HTTP 检查
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q 'healthz check passed' <&3"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aitutor-net

  # -------- Embedding 向量化服务（本地自托管，零调用费） --------
  # Infinity 提供 OpenAI 兼容接口；模型 bge-small-zh-v1.5（512 维，CPU 友好）
  # 镜像经华为云 SWR 的 ddn-k8s 同步代理拉取（同一 Infinity，仅来源不同）
  embedding:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/michaelf34/infinity:latest
    container_name: aitutor-embedding
    restart: unless-stopped
    ports:
      - "8081:7997"
    environment:
      # 模型首次下载走国内 HuggingFace 镜像，避免直连失败
      HF_ENDPOINT: "https://hf-mirror.com"
      TZ: Asia/Shanghai
    command: ["v2", "--model-id", "BAAI/bge-small-zh-v1.5", "--port", "7997"]
    volumes:
      # 镜像内 HF_HOME=/app/.cache/huggingface，卷须挂载到该路径才能持久化模型
      - hf-cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s   # 首次需下载模型，给足启动窗口
    networks:
      - aitutor-net

  # -------- 消息队列 --------
  # RabbitMQ（AMQP 0-9-1），management 镜像自带 Web 管理界面（答辩演示用）。
  # 华为云 ddn-k8s 代理对该镜像的 config blob 存在缺陷，改用 DaoCloud 公共代理拉取。
  rabbitmq:
    image: docker.m.daocloud.io/library/rabbitmq:3.13-management
    container_name: aitutor-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP 通信端口
      - "15672:15672"  # 管理界面：http://localhost:15672
    environment:
      # 自定义账号（默认 guest 仅允许容器内 localhost 访问，故显式设置）。
      # 生产环境必须替换为强密码并通过 env 文件注入。
      RABBITMQ_DEFAULT_USER: "aitutor"
      RABBITMQ_DEFAULT_PASS: "aitutor123"
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aitutor-net

  # -------- 统一入口 --------
  # 宿主 80 被 IIS(W3SVC) 占用，开发环境映射 8090；生产环境映射 80
  # 使用本地已有的 nginx:1.20（debian 基础，配置语法与 alpine 版一致）
  nginx:
    image: nginx:1.20
    container_name: aitutor-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - aitutor-net

# -------- 数据卷 --------
volumes:
  mysql-data:
  redis-data:
  minio-data:
  qdrant-data:
  hf-cache:
  rabbitmq-data:

# -------- 内部网络（服务间容器名互访） --------
networks:
  aitutor-net:
    driver: bridge
