spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_tutor?useUnicode=true&characterEncoding=utf8
    username: 你的本地数据库账号
    password: 你的本地数据库密码
  data:
    redis:
      host: 127.0.0.1
      port: 6381
      database: 0
      timeout: 3000ms
      lettuce:
        shutdown-timeout: 100ms

cors:
  allow-origins: http://localhost:5173,http://localhost:5174

# 短信验证码：aliyun=阿里云号码认证（需填写下方真实凭证）；mock 类已停用
sms:
  provider: aliyun

aliyun:
  sms:
    access-key-id: 你的AccessKeyId
    access-key-secret: 你的AccessKeySecret
    region-id: cn-hangzhou
    endpoint: dypnsapi.aliyuncs.com
    sign-name: 你的签名名称
    template-code: 你的模板编号

# 模拟扫码登录
qr:
  login:
    ttl-seconds: 120
    whitelist: 2024100236,T20001
